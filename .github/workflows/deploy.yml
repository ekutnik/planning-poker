name: Deploy

# Deploys main to Fly.io, only after CI has passed on that push, and exactly
# the commit CI checked. Rooms live in memory, so every deploy restarts the
# one machine: see the README's Deploy section before merging to main.
#
# Which version of this file runs: a workflow_run workflow always runs the
# copy on the default branch, develop, while the code it checks out and
# deploys comes from main (head_sha below). So a change to this file takes
# effect for main's deploys as soon as it lands on develop, before any
# release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time. A new one waits for the running one to finish
# rather than cancel it half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A push to main that passed CI. The event check matters: branches:
    # [main] above only compares branch names, so a pull request from a fork
    # whose branch is called main would pass it. Only a push to this
    # repository's main may reach the deploy token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # A hung deploy would otherwise hold the deploy group for GitHub's
    # default of six hours, and the next deploy would wait behind it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Fly's action, pinned to the commit of its tag 1.6: it handles the
      # deploy token, so a moved tag must not change what runs.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.108
      # FLY_API_TOKEN is a deploy token scoped to this one app. The image is
      # built here, on the runner (--local-only), not on a Fly builder.
      # --ha=false: flyctl otherwise creates a spare machine, which would
      # double the bill; rooms live in memory, so a spare would split them.
      # The image is tagged with the full SHA of the commit it was built
      # from, so the running image names its commit on main. The SHA comes
      # in through env:, not written into the script.
      #
      # Ignore the GH_SHA label flyctl also puts on the image: in a
      # workflow_run it is develop's head, where this file runs from, not
      # the commit deployed. The image tag is what counts.
      - run: flyctl deploy --local-only --ha=false --image-label "$HEAD_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # The deploy put that commit live: every machine runs the image tagged
      # with it (and there is at least one: all() of nothing is true).
      # Prints what is running first, so a failure shows which image is live.
      - run: |
          image="registry.fly.io/estimate-together:$HEAD_SHA"
          machines=$(flyctl machine list --json)
          printf '%s' "$machines" | jq -r '.[].config.image'
          printf '%s' "$machines" | jq -e --arg img "$image" 'length > 0 and all(.[]; .config.image == $img)'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # Still one small machine, no paid IPv4 and no volume (README, Deploy).
      # Even when a step above failed: a failed deploy is when an extra
      # machine is most likely to be left behind, billing.
      - if: ${{ !cancelled() }}
        run: scripts/check-fly-budget.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
