name: CI

on:
  # Every PR gets checked, whatever its base — stacked PRs included.
  pull_request:
  # On direct pushes, only the long-lived branches matter.
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Same steps, same order as `npm run check`, which the pre-push hook runs.
      - run: npm run build:web
      - run: npm run check:bundle
      - run: npm run build:server

  # The end-to-end suite (e2e/): the production build in Chromium, Firefox
  # and WebKit, with axe on every screen. The report is kept when it fails.
  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image, at the version package-lock.json locks (a test
    # holds the two together): the browsers and their system libraries are
    # in it, so nothing comes from Ubuntu's package mirror, which once held
    # this job for an hour (#114).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # A run takes about 8 minutes: a step that hangs fails, rather than run
    # for GitHub's default of 6 hours.
    timeout-minutes: 30
    env:
      # The image runs as root, and Firefox won't start as root with a HOME
      # it doesn't own (Playwright's docs for CI).
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The Docker image, built as the deploy builds it (BuildKit), and nothing
  # published. Then a smoke test of what a deploy relies on: it starts in
  # production, answers /health from outside the container, and stops with
  # 0 inside the stop timeout.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag planning-poker:ci .
        env:
          DOCKER_BUILDKIT: 1
      - run: docker run --detach --name app --publish 3000:3000 planning-poker:ci
      - run: |
          for attempt in $(seq 1 20); do
            curl --silent --fail http://127.0.0.1:3000/health && exit 0
            sleep 0.5
          done
          docker logs app
          exit 1
      - run: |
          docker stop --time 15 app
          docker logs app | tail -n 3
          test "$(docker inspect app --format '{{.State.ExitCode}}')" = 0
