name: CI

on:
  # Every PR gets checked, whatever its base — stacked PRs included.
  pull_request:
  # On direct pushes, only the long-lived branches matter.
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Same steps, same order as `npm run check`, which the pre-push hook runs.
      - run: npm run build:web
      - run: npm run check:bundle
