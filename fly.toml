# The Fly.io app (docs/decisions/0001: rooms live in memory). One machine,
# always running: a second machine would split the rooms between them, and
# a stopped one would drop them. So every deploy restarts it (see the
# README's Deploy section).
app = "estimate-together"
primary_region = "fra"

# SIGTERM starts the graceful shutdown (#29). Fly's default wait is 5 s;
# 15 s leaves room for SHUTDOWN_TIMEOUT_MS (10 s), so Fly never kills the
# process in the middle of it.
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

# NODE_ENV=production, HOST=0.0.0.0 and PORT=3000 come from the Dockerfile.
[env]
  # The client's address comes from Fly-Client-IP (src/server/client-ip.ts).
  PROXY = "fly"
  # Memory. The 256 MB machine has 207 MiB usable. Node's heap is capped at
  # 128 (a limit of about 131 MiB), so V8 collects hard long before the
  # machine runs out. MAX_ROOMS keeps the heap inside that: each person in a
  # room costs about 10.5 KiB of heap, and at the limit, 200 rooms of 30
  # plus 1,000 sockets not yet joined, it measured 86.9 MiB of heap and
  # 169 MiB for the whole process. The code's default is the same 200
  # (#63), so a deploy that loses this line is still safe; 10,000 rooms,
  # the default until v0.5.0, would not fit: 400 full rooms ran the heap
  # out.
  NODE_OPTIONS = "--max-old-space-size=128"
  MAX_ROOMS = "200"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

# One machine, so a crashed process is the whole app down: restart it.
# on-failure restarts after any non-zero exit (a crash, or running out of
# heap) and not after the deliberate exit 0 of a deploy's SIGTERM. It is
# Fly's default, set here so it can't change unnoticed.
[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
